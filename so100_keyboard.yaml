teleop:
  type: keyboard
  joint_names:
    - shoulder_pan.pos
    - shoulder_lift.pos
    - elbow_flex.pos
    - wrist_flex.pos
    - wrist_roll.pos
    - gripper.pos
  step_size: 5.0   # degrees
  key_bindings:
    a: [0, +1]   # joint index, direction
    d: [0, -1]
    w: [1, +1]
    s: [1, -1]
    r: [2, +1]
    f: [2, -1]
    t: [3, +1]
    g: [3, -1]
    y: [4, +1]
    h: [4, -1]
    o: [5, +1]
    l: [5, -1]